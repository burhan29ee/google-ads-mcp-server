[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-ads-mcp-server"
version = "0.1.0"
description = "A Google Ads MCP server with read AND write access: GAQL reporting plus campaign, budget, ad group, bid, and keyword management — with a validate-only dry run on every write."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Malik Burhan" }]
keywords = ["mcp", "model-context-protocol", "google-ads", "gaql", "ppc", "advertising", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.2,<2",
  "google-ads>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
google-ads-mcp-server = "google_ads_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/burhan29ee/google-ads-mcp-server"
Repository = "https://github.com/burhan29ee/google-ads-mcp-server"
Issues = "https://github.com/burhan29ee/google-ads-mcp-server/issues"
Changelog = "https://github.com/burhan29ee/google-ads-mcp-server/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
